<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elderglass</title>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <h1>Elderglass</h1>
            <span class="maker">Barking Noise Studios</span>
        </div>
        <div class="topbar__controls">
            <span class="midi-hint" id="midiHint">Click a control, then move a MIDI controller. Right-click clears.</span>
            <button type="button" class="pill" id="midiLearnButton">MIDI Learn</button>
            <div class="knob knob--small" data-param="duckSens" data-label="Sens"></div>
            <div class="knob knob--small" data-param="duck" data-label="Duck"></div>
            <div class="knob knob--small" data-param="output" data-label="Output"></div>
        </div>
    </header>

    <main class="rack" id="rack">
        <!-- Pedal panels are generated by main.js from the template below. -->
        <section class="routing" id="routing">
            <span class="routing__title">Routing</span>
            <div class="segmented" id="routingButtons">
                <button type="button" data-routing="0">Rev &rarr; Gran</button>
                <button type="button" data-routing="1">Gran &rarr; Rev</button>
                <button type="button" data-routing="2">Parallel</button>
            </div>
            <div class="routing__flow" id="routingFlow" aria-hidden="true"></div>
            <button type="button" class="pill" id="swapButton">Swap L / R</button>
            <button type="button" class="pill" id="stereoButton">Stereo</button>
            <button type="button" class="pill" id="faceplateButton">Matte black</button>
            <div class="knob knob--small" data-param="width" data-label="Width"></div>
            <div class="footswitch footswitch--master" data-midi="tapBoth">
                <span class="led" id="masterTapLed"></span>
                <button type="button" class="stomp" id="masterTap" aria-label="Tap both pedals, hold for Dive/Rise on both"></button>
                <span class="footswitch__label">tap &middot; hold both</span>
            </div>
        </section>
    </main>

    <template id="pedalTemplate">
        <section class="pedal">
            <div class="pedal__head">
                <h2 class="pedal__name"></h2>
            </div>
            <div class="program-wrap" data-midi-suffix="program">
                <select class="program" aria-label="Program"></select>
            </div>
            <p class="pedal__hint"></p>

            <div class="knobs">
                <div class="knob" data-suffix="feedback" data-label="Feedback"></div>
                <div class="knob" data-suffix="regen" data-label="Regen"></div>
                <div class="knob" data-suffix="mod" data-label="Mod"></div>
                <div class="knob" data-suffix="mix" data-label="Mix"></div>
                <div class="knob" data-suffix="x" data-label="X"></div>
                <div class="knob" data-suffix="time" data-label="Time"></div>
                <div class="knob" data-suffix="tone" data-label="Tone"></div>
                <div class="knob" data-suffix="modRate" data-label="Mod Rate"></div>
            </div>

            <div class="options">
                <button type="button" class="pill" data-toggle="sync">Sync</button>
                <select class="division" aria-label="Sync division"></select>
                <button type="button" class="pill" data-toggle="trails">Trails</button>
                <button type="button" class="pill" data-warpdir>Dive</button>
            </div>

            <div class="footswitches">
                <div class="footswitch" data-midi-suffix="bypass">
                    <span class="led led--bypass"></span>
                    <button type="button" class="stomp" data-stomp="bypass" aria-label="Bypass"></button>
                    <span class="footswitch__label">bypass</span>
                </div>
                <div class="footswitch" data-midi-suffix="tap">
                    <span class="led led--tap"></span>
                    <button type="button" class="stomp" data-stomp="tap" aria-label="Tap, hold for Dive/Rise"></button>
                    <span class="footswitch__label">tap &middot; hold</span>
                </div>
            </div>
        </section>
    </template>

    <script type="module" src="./main.js"></script>
</body>
</html>
