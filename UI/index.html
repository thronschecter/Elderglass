<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VST Template</title>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <main class="panel">
        <header>
            <h1>VST Template</h1>
            <button id="mute" class="toggle" type="button" aria-pressed="false">Mute</button>
        </header>

        <section class="controls">
            <div class="control">
                <label for="cutoff">Cutoff</label>
                <input id="cutoff" type="range" min="0" max="1" step="0.0001" />
                <output id="cutoffValue">2000 Hz</output>
            </div>

            <div class="control">
                <label for="filterType">Filter Type</label>
                <select id="filterType">
                    <option value="0">Low-pass</option>
                    <option value="1">Band-pass</option>
                    <option value="2">High-pass</option>
                </select>
            </div>

            <div class="control">
                <label for="gain">Gain</label>
                <input id="gain" type="range" min="0" max="1" step="0.0001" />
                <output id="gainValue">0.0 dB</output>
            </div>
        </section>

        <footer>
            <button id="greet" type="button">Say hello to C++</button>
            <span id="greetResult"></span>
        </footer>
    </main>

    <script type="module" src="./main.js"></script>
</body>
</html>
